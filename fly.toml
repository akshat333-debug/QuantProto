# fly.toml — Fly.io deployment config for the QuantProto API
# Deploy with: fly launch --no-deploy && fly deploy

app = "quantproto-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "9000"
  # Set secrets via: fly secrets set DATABASE_URL=... GEMINI_API_KEY=... API_KEY=...

[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[services]]
  protocol = "tcp"
  internal_port = 9000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"
